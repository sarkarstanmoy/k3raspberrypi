services:
  healthcheck:
    build: ./apps/healthcheck
    image: healthcheck:latest
    ports:
      - "3000:3000"
    restart: unless-stopped
  llamacpp-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    ports:
      - '9931:9931'
    volumes:
      - ./models:/models
    environment:
      LLAMA_ARG_HOST: '0.0.0.0'
      LLAMA_ARG_MODEL: /models/Qwen2.5-Math-1.5B.Q5_K_S.gguf
      LLAMA_ARG_CTX_SIZE: 4096
      LLAMA_ARG_N_PARALLEL: 2
      LLAMA_ARG_PORT: 9931
