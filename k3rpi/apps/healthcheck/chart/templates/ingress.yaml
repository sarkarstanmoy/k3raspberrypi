# Exposes the app outside the cluster, through Traefik (built into k3s).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthcheck
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: healthcheck
                port:
                  number: 80
